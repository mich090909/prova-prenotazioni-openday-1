<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuore 3D - Esercitazione liceo scientifico</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1f2937, #111827 60%);
      overflow: hidden;
    }

    #overlay {
      position: fixed;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      max-width: 420px;
      background: rgba(17, 24, 39, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 1rem;
      backdrop-filter: blur(6px);
      line-height: 1.4;
      z-index: 10;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.2rem;
      color: #fca5a5;
    }

    p {
      margin: 0.4rem 0;
      font-size: 0.95rem;
      color: #e5e7eb;
    }

    code {
      color: #fda4af;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>Rappresentazione 3D di un cuore</h1>
    <p>
      Esercitazione per classe terza: superficie parametrica
      <code>(u,v)</code> e animazione del battito cardiaco.
    </p>
    <p>Mouse: trascina per ruotare, rotellina per zoom.</p>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.165.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.165.0/examples/jsm/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111827);

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0.8, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Geometria parametrica del cuore.
    // u in [0, 2π], v in [0, π]
    const heartSurface = (u, v, target) => {
      const U = u * Math.PI * 2;
      const V = v * Math.PI;

      // Curva cuore 2D classica (x(U), y(U))
      const x2d = 16 * Math.pow(Math.sin(U), 3);
      const y2d =
        13 * Math.cos(U) -
        5 * Math.cos(2 * U) -
        2 * Math.cos(3 * U) -
        Math.cos(4 * U);

      // Rivoluzione attorno all'asse verticale + schiacciamento per forma "anatomica"
      const r = Math.abs(x2d) / 17;
      const y = (y2d - 2) / 11;

      const X = 2.1 * r * Math.cos(V);
      const Z = 1.8 * r * Math.sin(V);
      const Y = y;

      target.set(X, Y, Z);
    };

    const heartGeometry = new THREE.ParametricGeometry(heartSurface, 180, 120);
    heartGeometry.computeVertexNormals();

    const heartMaterial = new THREE.MeshStandardMaterial({
      color: 0xdc2626,
      roughness: 0.32,
      metalness: 0.08,
      emissive: 0x2a0000,
      side: THREE.DoubleSide
    });

    const heart = new THREE.Mesh(heartGeometry, heartMaterial);
    scene.add(heart);

    // Luce principale + controluce
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.25);
    keyLight.position.set(3, 4, 6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffe4e6, 0.7);
    fillLight.position.set(-3, 1, -4);
    scene.add(fillLight);

    const ambient = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambient);

    // Piccola griglia per riferimento spaziale
    const grid = new THREE.GridHelper(12, 24, 0x374151, 0x1f2937);
    grid.position.y = -2.5;
    scene.add(grid);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      // Animazione: battito (frequenza ~1.2 Hz)
      const pulse = 1 + 0.08 * Math.pow(Math.sin(t * 7.5), 8);
      heart.scale.setScalar(pulse);

      // Rotazione lenta per osservare la superficie
      heart.rotation.y = t * 0.25;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
